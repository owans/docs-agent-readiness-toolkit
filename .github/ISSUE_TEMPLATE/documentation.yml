name: Documentation improvement
description: Report unclear, missing, inconsistent, or broken public documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Public file, section, or URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect or difficult to understand.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: checks
    attributes:
      label: Content check
      options:
        - label: This issue contains no private research, internal URLs, secrets, or participant data.
          required: true
