name: Bug report
description: Report reproducible incorrect behavior in the public toolkit.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private documentation, internal URLs, or Rootstock evidence.
  - type: input
    id: revision
    attributes:
      label: Toolkit revision
      description: Commit hash or version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands and a generic fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: evidence-boundary
    attributes:
      label: Evidence boundary
      options:
        - SOURCE
        - BUILD
        - LIVE recorded evidence
        - RUNTIME_OBSERVATION
        - TASK_EVALUATION
        - EXTERNAL
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Public-content check
      options:
        - label: I removed secrets, private content, and identifying information.
          required: true
        - label: This report does not require live acquisition.
          required: true
